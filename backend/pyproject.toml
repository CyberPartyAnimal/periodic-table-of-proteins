[project]
name = "periodic-table-of-proteins-backend"
version = "1.0.0"
description = "FastAPI + PostgreSQL backend for the Periodic Table of Proteins"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "sqlalchemy[asyncio]>=2.0.44",
    "asyncpg>=0.30",
    "alembic>=1.17",
    "pydantic-settings>=2.11",
    "httpx>=0.28",
]

[tool.uv]
package = false
